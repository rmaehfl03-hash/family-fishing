<title>우리 가족 낚시일지</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#141a2b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="가족낚시게임">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#141a2b; --bg-deep:#0c0f1c;
  --panel:#1d2438; --panel-raised:#262f48; --panel-line:rgba(255,255,255,.09);
  --ink:#f4f1e6; --ink-soft:#9aa2c0;
  --gold:#ffce54; --gold-deep:#c98a1f;
  --coral:#ef7d5c; --coral-deep:#c85a3c;
  --teal:#4fd6c4; --violet:#8f7fd6;
  --shadow:rgba(0,0,0,.5);
  --g-common:#b7bdd6; --g-rare:#5ab4e0; --g-epic:#b28ce8; --g-legendary:#ffce54; --g-secret:#ff8a65; --g-primordial:#fff2c9;
  --white:#ffffff;
  color-scheme:dark;
}
*{box-sizing:border-box;}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:'Gowun Dodum', 'Malgun Gothic', sans-serif;
  display:flex; justify-content:center; min-height:100vh;
  -webkit-tap-highlight-color:transparent;
}
.tabular{ font-family:'JetBrains Mono', monospace; font-variant-numeric:tabular-nums; }
h1,h2,h3,.display{ font-family:'Jua', sans-serif; text-wrap:balance; font-weight:400; }
button{ font-family:inherit; }
::selection{ background:var(--gold); color:#1a1a2a; }

#frame{
  width:100%; max-width:460px; min-height:100vh; background:var(--bg);
  display:flex; flex-direction:column; position:relative;
  box-shadow:0 0 60px var(--shadow);
}

/* header */
#topbar{
  position:sticky; top:0; z-index:20; background:rgba(20,26,43,.92); backdrop-filter:blur(6px);
  border-bottom:1px solid var(--panel-line); padding:calc(12px + env(safe-area-inset-top)) 16px 10px;
}
#topbar-row{ display:flex; align-items:center; gap:10px; }
#avatar-btn{
  width:44px; height:44px; border-radius:50%; border:2px solid var(--gold);
  background:var(--panel-raised); color:var(--gold); font-family:'Jua',sans-serif; font-size:18px;
  display:flex; align-items:center; justify-content:center; flex-shrink:0; cursor:pointer;
}
#who{ flex:1; min-width:0; }
#who-name{ font-size:15px; font-weight:700; display:flex; align-items:center; gap:6px; }
#title-tag{ font-size:9.5px; font-weight:400; color:var(--gold); background:rgba(255,206,84,.15); padding:1px 6px; border-radius:8px; }
#title-tag:empty{ display:none; }
#sync-dot{ width:7px; height:7px; border-radius:50%; background:var(--ink-soft); flex-shrink:0; }
#sync-dot.on{ background:var(--teal); box-shadow:0 0 0 3px rgba(79,214,196,.25); }
#lv-row{ display:flex; align-items:center; gap:6px; font-size:11px; color:var(--ink-soft); margin-top:2px; }
#exp-track{ flex:1; height:5px; background:rgba(255,255,255,.08); border-radius:3px; overflow:hidden; }
#exp-fill{ height:100%; background:linear-gradient(90deg, var(--gold), var(--coral)); border-radius:3px; transition:width .4s; }
#points-box{ display:flex; align-items:center; gap:6px; flex-shrink:0; }
.coin{ flex-shrink:0; }
#points-val{ font-size:17px; font-weight:700; color:var(--gold); }

#region-tabs{ display:flex; gap:6px; margin-top:10px; overflow-x:auto; padding-bottom:2px; -webkit-overflow-scrolling:touch; scrollbar-width:thin; }
.region-tab{
  flex:0 0 auto; width:64px; text-align:center; padding:6px 4px 7px; border-radius:10px;
  border:1px solid var(--panel-line); background:var(--panel); cursor:pointer; color:var(--ink-soft);
  font-size:11px; position:relative; transition:transform .12s;
}
.region-tab.locked{ opacity:.6; cursor:default; }
.region-tab.active{ background:var(--rt-accent, var(--coral)); color:#1a1a2a; border-color:transparent; }
.region-tab .rt-name{ font-weight:700; display:block; font-size:12.5px; }
.region-tab .rt-sub{ font-size:9px; opacity:.85; }

/* main content */
#content{ flex:1; padding:16px; padding-bottom:96px; }
.card{ background:var(--panel); border:1px solid var(--panel-line); border-radius:16px; padding:16px; }
.section-title{ font-size:13px; letter-spacing:.04em; color:var(--ink-soft); text-transform:uppercase; margin:22px 0 10px; }
.section-title:first-child{ margin-top:0; }

/* fishing scene */
#scene{
  border-radius:18px; padding:22px 16px 18px; text-align:center; position:relative; overflow:hidden; min-height:280px;
  background:var(--scene-bg); border:1px solid var(--panel-line);
}
.mountains{ position:absolute; left:0; right:0; bottom:0; width:100%; height:68%; pointer-events:none; }
.water-band{ position:absolute; left:0; right:0; bottom:0; height:18%; pointer-events:none;
  background:linear-gradient(180deg, rgba(255,255,255,.10), rgba(0,0,0,.30)); }
.sky-glow{ position:absolute; width:46px; height:46px; margin:-23px 0 0 -23px; border-radius:50%; opacity:.92; pointer-events:none; }
.star{ position:absolute; width:2px; height:2px; background:#fff; border-radius:50%; opacity:.6; pointer-events:none; animation:twinkleStar 3s ease-in-out infinite; }
@keyframes twinkleStar{ 0%,100%{ opacity:.2; } 50%{ opacity:.9; } }
.glow-dot{ position:absolute; width:3px; height:3px; border-radius:50%; pointer-events:none; animation:tw 2.6s ease-in-out infinite; }
@keyframes tw{ 0%,100%{ opacity:.2; transform:scale(.8); } 50%{ opacity:1; transform:scale(1.5); } }
.abyss-vignette{ position:absolute; inset:0; pointer-events:none;
  background: radial-gradient(ellipse at 50% 0%, rgba(120,160,220,.16), transparent 55%), radial-gradient(ellipse at 50% 100%, rgba(0,0,0,.5), transparent 60%); }
.boat{ position:absolute; right:5%; bottom:16%; width:56px; height:auto; pointer-events:none; filter:drop-shadow(0 3px 5px rgba(0,0,0,.45)); overflow:visible; }
#rod-arm{ transform-origin:30px 26px; }
#rod-arm.casting{ animation:rodSwing .55s cubic-bezier(.32,0,.2,1); }
@keyframes rodSwing{ 0%{ transform:rotate(0deg); } 22%{ transform:rotate(-26deg); } 68%{ transform:rotate(16deg); } 100%{ transform:rotate(0deg); } }
@media (prefers-reduced-motion: reduce){ #rod-arm.casting{ animation:none; } }
.sub-anchor{ position:absolute; left:44%; top:0; width:58px; pointer-events:none; }
.submersible{ width:100%; height:auto; filter:drop-shadow(0 3px 8px rgba(0,0,0,.5)); }
@media (prefers-reduced-motion: reduce){ .star,.glow-dot{ animation:none; opacity:.6; } }

#cast-svg{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
#splash-layer{ position:absolute; inset:0; pointer-events:none; overflow:hidden; }
.splash-ring{ position:absolute; width:6px; height:6px; margin:-3px 0 0 -3px; border:2px solid rgba(255,255,255,.85); border-radius:50%; animation:splashring .9s ease-out forwards; }
.splash-ring.loop{ animation:splashring 2s ease-out infinite; }
@keyframes splashring{ from{ width:6px;height:6px;margin:-3px 0 0 -3px; opacity:.85; } to{ width:60px; height:60px; margin:-30px 0 0 -30px; opacity:0; } }
.droplet{ position:absolute; width:4px; height:4px; border-radius:50%; background:rgba(255,255,255,.9); animation:drop .5s ease-out forwards; }
@keyframes drop{ from{ transform:translate(0,0); opacity:1; } to{ transform:translate(var(--dx),var(--dy)); opacity:0; } }
.bubble{ position:absolute; width:5px; height:5px; border-radius:50%; background:rgba(200,230,255,.55); animation:bubbleUp 1.6s ease-out forwards; }
@keyframes bubbleUp{ from{ transform:translateY(0); opacity:.8; } to{ transform:translateY(-70px); opacity:0; } }

.scene-fg{ position:relative; z-index:2; }
#scene-region{ font-size:12px; color:rgba(244,241,230,.75); text-shadow:0 1px 6px rgba(0,0,0,.55); }
#scene-title{ font-size:27px; margin:2px 0 14px; color:var(--white); text-shadow:0 2px 8px rgba(0,0,0,.55); }
#scene-status{ font-size:14px; min-height:20px; color:rgba(244,241,230,.9); margin-bottom:10px; text-shadow:0 1px 6px rgba(0,0,0,.55); }

.rig{ position:absolute; left:-4px; bottom:-6px; width:100px; height:auto; pointer-events:none; z-index:1; filter:drop-shadow(0 4px 6px rgba(0,0,0,.45)); }
.rig svg{ width:100%; height:auto; display:block; }

#tension-wrap{ display:none; margin-top:6px; position:relative; z-index:2; }
#tension-wrap.show{ display:block; }
#tension-track{ position:relative; height:22px; background:rgba(0,0,0,.4); border-radius:11px; overflow:hidden; border:1px solid rgba(255,255,255,.3); }
.zone{ position:absolute; top:0; bottom:0; }
.zone.good{ background:rgba(255,206,84,.42); }
.zone.perfect{ background:var(--gold); }
#marker{ position:absolute; top:-3px; width:4px; height:28px; background:var(--coral); border-radius:2px; box-shadow:0 0 0 2px rgba(0,0,0,.5); }

#cast-btn, #hook-btn{
  margin-top:16px; border:none; border-radius:14px; padding:14px 20px; width:100%;
  font-family:'Jua',sans-serif; font-size:17px; cursor:pointer; letter-spacing:.02em;
  background:linear-gradient(180deg, var(--coral), var(--coral-deep)); color:var(--white); transition:transform .08s, opacity .2s;
  box-shadow:0 4px 0 var(--coral-deep), 0 6px 14px rgba(0,0,0,.35);
}
#hook-btn{ background:linear-gradient(180deg, var(--gold), var(--gold-deep)); box-shadow:0 4px 0 var(--gold-deep), 0 6px 14px rgba(0,0,0,.35); color:#241a08; }
#cast-btn:active, #hook-btn:active{ transform:translateY(3px); box-shadow:0 1px 0 var(--coral-deep); }
#cast-btn:disabled{ opacity:.45; cursor:default; }
#odds-btn{ margin-top:10px; border:none; color:#fff; font-size:11.5px; cursor:pointer; background:rgba(0,0,0,.28); padding:5px 12px; border-radius:20px; position:relative; z-index:2; }

/* fish grid / dex */
.fish-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; position:relative; z-index:1; }
.fish-card{ background:rgba(255,255,255,.14); backdrop-filter:blur(2px); border:1px solid rgba(255,255,255,.25); border-radius:12px; padding:10px 6px 8px; text-align:center; position:relative; }
.fish-card .fic{ width:100%; max-width:58px; height:auto; margin:0 auto 6px; display:block; }
.fish-card .fname{ font-size:11px; font-weight:700; line-height:1.25; min-height:28px; display:flex; align-items:center; justify-content:center; color:#fff; }
.fish-card .fpts{ font-size:10px; color:rgba(255,255,255,.75); margin-top:2px; }
.fish-card .fcnt{ position:absolute; top:5px; right:6px; font-size:9px; background:var(--gold); color:#241a08; font-weight:700; border-radius:8px; padding:1px 5px; }
.fish-card.uncaught .fname{ color:rgba(255,255,255,.55); }
.fish-card.uncaught .fic{ opacity:.4; filter:grayscale(1) brightness(1.4); }
.grade-strip{ height:3px; border-radius:2px; margin-bottom:6px; }
.progress-row{ display:flex; align-items:center; gap:8px; margin:4px 0 16px; position:relative; z-index:1; }
.progress-track{ flex:1; height:8px; border-radius:5px; background:rgba(255,255,255,.15); overflow:hidden; }
.progress-fill{ height:100%; background:linear-gradient(90deg,var(--gold),var(--coral)); }
.progress-fill.fam{ background:linear-gradient(90deg,var(--teal),var(--violet)); }
.dex-dual{ display:flex; gap:14px; margin:4px 0 14px; position:relative; z-index:1; }
.dex-dual-item{ flex:1; }
.ddi-label{ font-size:10.5px; color:rgba(255,255,255,.8); margin-bottom:4px; }
.dex-dual .tabular{ font-size:11px; color:rgba(255,255,255,.85); margin-top:3px; }
.progress-row .tabular{ color:var(--ink-soft); }
.dex-ocean .progress-row .tabular{ color:rgba(255,255,255,.85); }
.dex-tabs{ display:flex; gap:6px; margin-bottom:12px; }
.dex-tab{ flex:1; text-align:center; padding:6px; border-radius:8px; font-size:11px; border:1px solid var(--panel-line); background:var(--panel); cursor:pointer; color:var(--ink-soft); }
.dex-tab.active{ background:var(--teal); color:#0c2c26; border-color:transparent; font-weight:700; }
.dex-scope-toggle{ display:flex; gap:6px; margin-bottom:10px; font-size:11px; position:relative; z-index:1; }
.pill-toggle{ padding:5px 10px; border-radius:20px; border:1px solid var(--panel-line); background:var(--panel); cursor:pointer; color:var(--ink-soft); }
.pill-toggle.active{ background:var(--ink); color:#1a1a2a; border-color:var(--ink); }
.dex-ocean .pill-toggle{ background:rgba(0,0,0,.25); border-color:rgba(255,255,255,.25); color:rgba(255,255,255,.8); }
.dex-ocean .pill-toggle.active{ background:#fff; color:#1a1a2a; }

.dex-ocean{
  position:relative; border-radius:18px; padding:16px; margin-bottom:16px; overflow:hidden;
  background:linear-gradient(180deg, #bdeaf0 0%, #4fa6c9 40%, #1c5c86 72%, #0c2c4a 100%);
  border:1px solid var(--panel-line);
}
.dex-ocean .rays{ position:absolute; inset:0; opacity:.3; pointer-events:none;
  background:
    linear-gradient(100deg, transparent 18%, rgba(255,255,255,.6) 22%, transparent 30%),
    linear-gradient(100deg, transparent 45%, rgba(255,255,255,.45) 49%, transparent 57%),
    linear-gradient(100deg, transparent 68%, rgba(255,255,255,.4) 72%, transparent 80%);
}
.amb-bubble{ position:absolute; bottom:-10px; border-radius:50%; background:rgba(255,255,255,.5); pointer-events:none; animation:ambBubble 6s linear infinite; }
@keyframes ambBubble{ from{ transform:translateY(0); opacity:.7; } to{ transform:translateY(-280px); opacity:0; } }
@media (prefers-reduced-motion: reduce){ .amb-bubble{ animation:none; opacity:0; } }

/* shop */
.shop-item{ display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--panel-line); }
.shop-item:last-child{ border-bottom:none; }
.shop-icon{ width:40px; height:40px; border-radius:10px; background:rgba(255,255,255,.08); color:var(--gold); display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:18px; }
.shop-info{ flex:1; min-width:0; }
.shop-name{ font-size:14px; font-weight:700; }
.shop-desc{ font-size:11.5px; color:var(--ink-soft); margin-top:2px; line-height:1.4; }
.shop-buy{ flex-shrink:0; display:flex; flex-direction:column; align-items:flex-end; gap:4px; }
.buy-btn{ border:none; border-radius:9px; padding:7px 12px; font-size:12px; font-weight:700; cursor:pointer; background:linear-gradient(180deg,var(--gold),var(--gold-deep)); color:#241a08; white-space:nowrap; }
.buy-btn.owned{ background:rgba(255,255,255,.10); color:var(--ink-soft); }
.buy-btn.equipped{ background:linear-gradient(180deg,var(--teal),#2a9d8f); color:#062a24; }
.buy-btn:disabled{ opacity:.45; cursor:default; }
.price-tag{ font-size:11px; color:var(--ink-soft); }

/* ranking */
.rank-row{ display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--panel-line); }
.rank-row:last-child{ border-bottom:none; }
.rank-num{ width:22px; text-align:center; font-weight:700; color:var(--ink-soft); font-family:'JetBrains Mono',monospace; }
.rank-num.top{ color:var(--gold); }
.rank-name{ flex:1; font-size:14px; font-weight:700; display:flex; flex-wrap:wrap; align-items:center; gap:6px; }
.rank-sub{ font-size:10.5px; color:var(--ink-soft); font-weight:400; width:100%; }
.rank-val{ font-family:'JetBrains Mono',monospace; font-weight:700; color:var(--gold); }
.feed-row{ display:flex; gap:10px; align-items:center; padding:8px 0; border-bottom:1px dashed var(--panel-line); font-size:12px; }
.feed-row:last-child{ border-bottom:none; }
.feed-time{ color:var(--ink-soft); font-size:10px; width:38px; flex-shrink:0; font-family:'JetBrains Mono',monospace; }
.grade-chip{ font-size:9.5px; padding:2px 6px; border-radius:20px; color:#1c2233; font-weight:700; letter-spacing:.02em; }

/* bottom nav */
#navbar{
  position:sticky; bottom:0; z-index:20; background:rgba(20,26,43,.94); backdrop-filter:blur(6px); border-top:1px solid var(--panel-line);
  display:flex; padding:8px 6px calc(8px + env(safe-area-inset-bottom));
}
.nav-btn{ flex:1; background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 0; cursor:pointer; color:var(--ink-soft); }
.nav-btn.active{ color:var(--gold); }
.nav-btn svg{ width:20px; height:20px; }
.nav-btn span{ font-size:10.5px; }

/* modal */
#modal-layer{ position:fixed; inset:0; z-index:100; display:none; align-items:flex-end; justify-content:center; }
#modal-layer.show{ display:flex; }
#modal-backdrop{ position:absolute; inset:0; background:rgba(0,0,0,.6); }
.sheet{ position:relative; width:100%; max-width:460px; background:var(--panel-raised); border-radius:20px 20px 0 0; padding:22px 20px calc(24px + env(safe-area-inset-bottom)); max-height:86vh; overflow-y:auto; border-top:1px solid var(--panel-line); }
.sheet h2{ margin:0 0 4px; font-size:21px; color:var(--white); }
.sheet .sub{ color:var(--ink-soft); font-size:12.5px; margin-bottom:16px; }
.sheet input[type=text]{ width:100%; padding:12px; border-radius:10px; border:1px solid var(--panel-line); background:var(--bg); color:var(--ink); font-size:15px; font-family:inherit; }
.sheet-close{ margin-top:16px; width:100%; padding:13px; border-radius:12px; border:none; background:linear-gradient(180deg,var(--gold),var(--gold-deep)); color:#241a08; font-weight:700; font-size:15px; cursor:pointer; }
.sheet-close.ghost{ background:rgba(255,255,255,.08); color:var(--ink); margin-top:8px; }
.profile-list{ display:flex; flex-direction:column; gap:8px; }
.profile-row{ display:flex; align-items:center; gap:10px; padding:10px; border:1px solid var(--panel-line); border-radius:12px; cursor:pointer; background:var(--bg); }
.profile-row.active{ border-color:var(--gold); background:rgba(255,206,84,.10); }
.profile-row .pname{ flex:1; font-weight:700; font-size:14px; }
.profile-row .plv{ font-size:11px; color:var(--ink-soft); }
.big-btn{ width:100%; padding:13px; border-radius:12px; border:1px dashed var(--panel-line); background:none; color:var(--ink-soft); font-size:13px; cursor:pointer; margin-top:4px; }

.catch-fish-wrap{ text-align:center; padding:14px 0 6px; }
.catch-fish-wrap .fic{ width:130px; height:auto; margin:0 auto 10px; }
.sparkle-mark{ animation:sparkleTwinkle 1.3s ease-in-out infinite; transform-origin:center; transform-box:fill-box; }
@keyframes sparkleTwinkle{ 0%,100%{ opacity:.15; transform:scale(.5); } 50%{ opacity:1; transform:scale(1.2); } }
@media (prefers-reduced-motion: reduce){ .sparkle-mark{ animation:none; opacity:.7; } }
.catch-name{ font-size:23px; margin:2px 0 6px; color:var(--white); }
.catch-pts{ font-size:15px; color:var(--gold); font-weight:700; }
.perfect-badge{ display:inline-block; margin-top:8px; background:linear-gradient(180deg,var(--gold),var(--gold-deep)); color:#241a08; font-size:11px; padding:4px 10px; border-radius:20px; font-weight:700; }
.fact-box{ margin-top:12px; background:rgba(255,255,255,.06); border-radius:10px; padding:10px 12px; font-size:12px; line-height:1.55; color:var(--ink-soft); text-align:left; }

.toast{ position:fixed; left:50%; bottom:110px; transform:translateX(-50%); background:var(--panel-raised); border:1px solid var(--panel-line); color:var(--ink); padding:10px 18px; border-radius:20px; font-size:13px; z-index:200; opacity:0; pointer-events:none; transition:opacity .25s, bottom .25s; }
.toast.show{ opacity:1; bottom:130px; }

.celebrate{ position:fixed; inset:0; z-index:300; display:none; align-items:center; justify-content:center; background:radial-gradient(ellipse at center, rgba(30,20,50,.7), rgba(5,5,15,.92)); }
.celebrate.show{ display:flex; }
.celebrate-card{ text-align:center; color:var(--white); padding:20px; }
.celebrate-card .fic{ width:170px; height:auto; margin:0 auto 14px; }
.celebrate-card h2{ font-size:29px; margin:0 0 6px; color:var(--gold); }
.celebrate-card p{ font-size:13px; opacity:.85; max-width:280px; margin:6px auto 0; line-height:1.5; }

.odds-table{ width:100%; border-collapse:collapse; font-size:12px; }
.odds-table td{ padding:6px 4px; border-bottom:1px solid var(--panel-line); }
.odds-table td:last-child{ text-align:right; font-family:'JetBrains Mono',monospace; }

.lock-note{ font-size:11px; color:var(--ink-soft); margin-top:2px; }
::-webkit-scrollbar{ width:0; height:0; }
</style>

<div id="frame">
  <div id="topbar">
    <div id="topbar-row">
      <button id="avatar-btn"></button>
      <div id="who">
        <div id="who-name"><span id="sync-dot"></span><span id="name-text">-</span><span id="title-tag"></span></div>
        <div id="lv-row"><span id="lv-text" class="tabular">Lv.1</span><div id="exp-track"><div id="exp-fill" style="width:0%"></div></div></div>
      </div>
      <div id="points-box">
        <svg class="coin" width="18" height="18" viewBox="0 0 18 18"><circle cx="9" cy="9" r="8" fill="#ffce54" stroke="#c98a1f" stroke-width="1.4"/><text x="9" y="12.5" text-anchor="middle" font-size="9" font-family="Jua" fill="#8a5a12">P</text></svg>
        <div id="points-val" class="tabular">0</div>

function jellyfishTentacles(color){
  const xs=[26,38,50,62,74,86,98,110,120];
  return xs.map((x,i)=>{
    const len = 34+((i%3)*12);
    const sway = (i%2===0? 7:-7);
    return `<path d="M${x},46 C${x+sway},${46+len*0.45} ${x-sway},${46+len*0.8} ${x},${46+len}" stroke="${color}" stroke-width="1.7" fill="none" stroke-linecap="round" opacity=".65"/>`;
  }).join('');
}
function patternOverlayOne(pattern,color){
  if(!pattern || pattern==='none') return '';
  if(pattern==='spots'){
    const pts=[[50,34],[68,30],[86,36],[104,44],[56,56],[76,58],[96,54],[42,48],[62,44],[80,48],[100,36],[46,60]];
    return pts.map(([x,y],i)=>`<circle cx="${x}" cy="${y}" r="${2+(i%3)}" fill="${color}" opacity=".8"/>`).join('');
  }
  if(pattern==='stripes'){
    let s=''; for(let i=0;i<5;i++){ const x=40+i*20; s+=`<path d="M${x},24 C${x-6},40 ${x-6},60 ${x},76" stroke="${color}" stroke-width="2" fill="none" opacity=".5"/>`; } return s;
  }
  if(pattern==='tiger'){
    let s=''; const ys=[26,36,46,56,66,74];
    ys.forEach((y,i)=>{ const off=(i%2)*10; s+=`<path d="M${28+off},${y} L${50+off},${y-5} L${72+off},${y+4} L${94+off},${y-4} L${116+off},${y}" stroke="${color}" stroke-width="2.2" fill="none" opacity=".55" stroke-linecap="round"/>`; });
    return s;
  }
  if(pattern==='mottle'){
    const blobs=[[40,32,8],[58,28,6],[74,36,7],[46,52,6],[64,56,8],[36,60,5],[82,46,6]];
    return blobs.map(([x,y,r])=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${color}" opacity=".3"/>`).join('');
  }
  if(pattern==='band') return `<path d="M92,20 C86,36 86,64 92,80" stroke="${color}" stroke-width="4" fill="none" opacity=".7"/>`;
  if(pattern==='lateral') return `<path d="M15,50 C50,52 110,52 150,50" stroke="${color}" stroke-width="2" fill="none" opacity=".7"/>`;
  return '';
}
function patternOverlay(art){
  const list = art.patterns || (art.pattern ? [{type:art.pattern, color:art.accent||art.fin}] : []);
  return list.map(p=>patternOverlayOne(p.type,p.color)).join('');
}

function gillLine(eye){

}
function renderFishSVG(art, fishId){

  p += `<path d="${t.body}" fill="url(#${gid})" ${outline}/>`;
  if(t.belly) p += `<path d="${t.belly}" fill="${art.bl}" opacity=".3"/>`;
  if(t.tentFringe) p += jellyfishTentacles(art.fin);
  p += patternOverlay(art);
  if(t.tail) p += `<path d="${t.tail}" fill="${art.fin}" ${outline}/>`;
  if(t.finL){ p += `<path d="${t.finL}" fill="${art.fin}" ${outline}/><path d="${t.finL2}" fill="${art.fin}" ${outline}/>`; }

  if(t.pect) p += `<path d="${t.pect}" fill="${art.fin}" opacity=".95" ${outline}/>`;
  if(t.eye) p += gillLine(t.eye);
  (art.extras||[]).forEach(ex=>{ if(ex==='lure') p += EXTRAS.lure(art.fin, art.glow); else if(EXTRAS[ex]) p += EXTRAS[ex](art.accent||art.fin); });

}

function fishIconStyled(fish, traits, baseSizePx){
  traits = traits || [];
  let scale = 1;
  traits.forEach(t=>{ if(t.scale) scale *= t.scale; });
  const shiny = traits.some(t=>t.id==='shiny');
  const mutant = traits.some(t=>t.id==='mutant');
  let svg = renderFishSVG(FISH_ART[fish.id], fish.id);
  let inner = '';
  if(mutant) inner += mutantOverlay();
  if(shiny) inner += sparkleOverlay();
  if(inner) svg = svg.replace('</svg>', inner+'</svg>');
  if(scale!==1 && baseSizePx){
    svg = svg.replace('class="fic"', `class="fic" style="width:${Math.round(baseSizePx*scale)}px"`);
  }
  return svg;
}

function expForLevel(L){
  if(L<=1) return 0;
  if(L<=10) return Math.round(39*Math.pow(L-1,1.75)); // +50% from original 26 coefficient
  if(L<=49) return expForLevel(10) + Math.round(85*Math.pow(L-10,2));
  const base49 = expForLevel(10) + Math.round(85*Math.pow(39,2));
  const hardStep = Math.round(85*2*39*5); // level-49→50 step jumps to 5x its old pace
  const stepAt = m => Math.round(hardStep*(m+1)*(1+0.005*m));
  if(L<=99) return base49 + stepAt(L-50); // gentle growth per level after that
  const exp99 = base49 + stepAt(49);
  const gap99to100 = stepAt(50) - stepAt(49);
  const j = L-100;
  const geoSum = (Math.pow(1.25, j+1) - 1) / 0.25; // 1 + 1.25 + 1.25^2 + ... + 1.25^j
  return exp99 + Math.round(3*gap99to100*geoSum); // Lv.100 req = 3x original gap, then +25% per level after
}
function levelGradeBonus(level){
  let secretBonus=0, primordialBonus=0;
  if(level>=50) secretBonus += 1;
  if(level>=100){ secretBonus += 1; primordialBonus += 1; }
  return {secretBonus, primordialBonus};
}
function levelFromExp(totalExp){
  let L=1;
  while(expForLevel(L+1) <= totalExp) L++;
  return L;
}
function expProgress(totalExp){
  const L = levelFromExp(totalExp);
  const cur = expForLevel(L), next = expForLevel(L+1);
  return { level:L, cur, next, pct: Math.max(0,Math.min(100,(totalExp-cur)/(next-cur)*100)) };
}
function regionCatchCount(p, regionId){
  return FISH.filter(f=>f.region===regionId).reduce((s,f)=> s+(p.dex[f.id]||0), 0);
}
function regionDexCount(p, regionId){
  return FISH.filter(f=>f.region===regionId && p.dex[f.id]).length;
}
function isRegionUnlocked(p, region){
  const lvl = expProgress(p.totalExp).level;
  if(lvl < region.unlockLv) return false;
  if(region.requireRegion){
    if(region.requireDexCount!=null){
      if(regionDexCount(p, region.requireRegion) < region.requireDexCount) return false;
    } else if(region.requireCount!=null){
      if(regionCatchCount(p, region.requireRegion) < region.requireCount) return false;
    }
  }
  if(region.requireRegions){
    for(const req of region.requireRegions){
      if(req.dexCount!=null){
        if(regionDexCount(p, req.region) < req.dexCount) return false;
      } else if(req.count!=null){
        if(regionCatchCount(p, req.region) < req.count) return false;
      }
    }
  }
  return true;
}

/* probability engine */
function currentRod(profile){ return byId(RODS, profile.rod) || RODS[0]; }

function computeWeights(regionId, rod, perfect){
  const region = regionOf(regionId);
  const w = {...region.weights};
  if(rod.rareToSecretBonus){
    ['rare','epic','legendary','secret'].forEach(g=>{
      const shift = Math.min(w.common, rod.rareToSecretBonus);
      w.common -= shift; w[g] += shift;
    });
  }
  if(rod.primordialMult && w.primordial>0){
    const extra = w.primordial*(rod.primordialMult-1);
    w.primordial *= rod.primordialMult;
    const others = GRADES.filter(g=>g!=='primordial');
    const total = others.reduce((s,g)=>s+w[g],0);
    if(total>0) others.forEach(g=> w[g] -= extra*(w[g]/total));
  }
  if(rod.legendaryPlusMult){
    const targets = ['legendary','secret','primordial'];
    let extra = 0;
    targets.forEach(g=>{ if(w[g]>0){ const add = w[g]*(rod.legendaryPlusMult-1); extra += add; w[g] += add; } });
    const others = GRADES.filter(g=>!targets.includes(g));
    const total = others.reduce((s,g)=>s+w[g],0);
    if(total>0) others.forEach(g=> w[g] -= extra*(w[g]/total));
  }
  const lvlBonus = levelGradeBonus(expProgress(profile.totalExp).level);
  if(lvlBonus.secretBonus>0){
    const shift = Math.min(w.common, lvlBonus.secretBonus);
    w.common -= shift; w.secret += shift;
  }
  if(lvlBonus.primordialBonus>0){
    const shift = Math.min(w.common, lvlBonus.primordialBonus);
    w.common -= shift; w.primordial += shift;
  }
  if(profile.dexRewards.river){
    ['legendary','secret','primordial'].forEach(g=>{
      const shift = Math.min(w.common, 0.15);
      w.common -= shift; w[g] += shift;
    });
  }
  const titleEff = equippedTitleEffect();
  if(titleEff.rareBonus){
    ['rare','epic','legendary','secret'].forEach(g=>{
      const shift = Math.min(w.common, titleEff.rareBonus);
      w.common -= shift; w[g] += shift;
    });
  }
  if(titleEff.legendaryBonus){
    ['legendary','secret','primordial'].forEach(g=>{
      const shift = Math.min(w.common, titleEff.legendaryBonus);
      w.common -= shift; w[g] += shift;
    });
  }
  if(titleEff.secretBonus){
    const shift = Math.min(w.common, titleEff.secretBonus);
    w.common -= shift; w.secret += shift;
  }
  if(titleEff.primordialBonus){
    const shift = Math.min(w.common, titleEff.primordialBonus);
    w.common -= shift; w.primordial += shift;
  }
  if(perfect){
    const mult = rod.perfectMult || 1.5;
    ['legendary','secret','primordial'].forEach(g=>{ if(w[g]>0) w[g]*=mult; });
  }
  GRADES.forEach(g=> w[g]=Math.max(w[g],0));
  const total = GRADES.reduce((s,g)=>s+w[g],0) || 1;
  GRADES.forEach(g=> w[g] = w[g]/total*100);
  return w;
}
function pickGrade(weights){
  const r = Math.random()*100; let acc=0;
  for(const g of GRADES){ acc+=weights[g]; if(r<=acc) return g; }
  return 'common';
}
function pickFish(regionId, grade){
  const list = fishInRegion(regionId, grade);
  if(!list.length) return null;
  return list[Math.floor(Math.random()*list.length)];
}
function guaranteedGrade(regionId, rod, perfect){
  const base = byId(CONSUMABLES,'guaranteedEpic').pool;
  const pool = {};
  Object.keys(base).forEach(g=>{ if(fishInRegion(regionId,g).length) pool[g]=base[g]; });
  if(!Object.keys(pool).length) return null;
  if(perfect){ const mult = rod.perfectMult||1.5; ['legendary','secret','primordial'].forEach(g=>{ if(pool[g]) pool[g]*=mult; }); }
  const total = Object.values(pool).reduce((a,b)=>a+b,0);
  let r = Math.random()*total, acc=0;
  for(const g in pool){ acc+=pool[g]; if(r<=acc) return g; }
  return Object.keys(pool)[0];
}

let db = null, dbAvailable = false;
let familyPlayers = [], familyState = {dex:{}, feed:[]};

async function initDb(){
  try{ db = await claude.use('db'); }catch(e){ db = null; }
  dbAvailable = !!db;
  renderSyncDot();
  if(dbAvailable){
    try{
      db.collection('players').onSnapshot(snap=>{
        familyPlayers = snap.docs.map(d=>({id:d.id, ...d.data()}));
        renderRankIfActive(); renderDexIfActive();
      }, ()=>{ dbAvailable=false; renderSyncDot(); });
      db.doc('family/state').onSnapshot(snap=>{
        familyState = snap.exists ? snap.data() : {dex:{}, feed:[]};
        familyState.dex = familyState.dex || {}; familyState.feed = familyState.feed || [];
        renderRankIfActive(); renderDexIfActive();
      }, ()=>{ dbAvailable=false; renderSyncDot(); });
      pushProfileToDb();
    }catch(e){ dbAvailable=false; renderSyncDot(); }
  }
}
async function pushProfileToDb(){
  if(!dbAvailable || !profile) return;
  try{
    await db.collection('players').doc(profile.id).set({
      name:profile.name, points:profile.points, totalExp:profile.totalExp,
      level:expProgress(profile.totalExp).level, dexCount:Object.keys(profile.dex).length,
      title: profile.cosmetics.equipped.title, updatedAt: Date.now()
    });
  }catch(e){}
}
async function pushCatchToFamily(fish, grade, points, perfect, traits){
  if(!dbAvailable) return;
  try{
    const ref = db.doc('family/state');
    const snap = await ref.get();
    const data = snap.exists ? (snap.data()||{}) : {};
    const dex = data.dex || {};
    const prev = dex[fish.id] || {count:0, firstBy:profile.name, firstAt:Date.now()};
    dex[fish.id] = {count:(prev.count||0)+1, firstBy:prev.firstBy||profile.name, firstAt:prev.firstAt||Date.now()};
    const feed = [{ts:Date.now(), player:profile.name, fish:fish.name, grade, points, perfect, trait: traits&&traits.length ? traits.map(t=>t.name).join(' ') : null}, ...(data.feed||[])].slice(0,30);
    await ref.set({dex, feed, updatedAt:Date.now()});
  }catch(e){}
}
function renderSyncDot(){
  const dot = $('#sync-dot');
  if(!dot) return;
  dot.classList.toggle('on', dbAvailable);
  dot.title = dbAvailable ? '가족과 실시간 공유 중' : '이 기기에만 저장됨';

function familyMembers(){
  const map = new Map();
  Object.values(store.profiles).forEach(p=> map.set(p.id, {
    id:p.id, name:p.name, points:p.points, level:expProgress(p.totalExp).level,
    dexCount:Object.keys(p.dex).length, title:p.cosmetics.equipped.title, local:true
  }));
  familyPlayers.forEach(p=>{
    if(!map.has(p.id)) map.set(p.id, {id:p.id, name:p.name, points:p.points||0, level:p.level||1, dexCount:p.dexCount||0, title:p.title, local:false});
  });
  return Array.from(map.values());
}
function familyDexCount(fishId){
  let c=0;
  Object.values(store.profiles).forEach(p=>{ c += p.dex[fishId]||0; });
  c += (familyState.dex[fishId] && familyState.dex[fishId].count) || 0;
  return c;
}
function combinedFeed(){
  const localEntries = localFeed.map(e=>({...e}));
  const dbEntries = familyState.feed || [];
  const all = [...localEntries, ...dbEntries];
  all.sort((a,b)=>b.ts-a.ts);
  const seen = new Set(); const out=[];
  for(const e of all){ const k=e.ts+'|'+e.player+'|'+e.fish; if(seen.has(k)) continue; seen.add(k); out.push(e); if(out.length>=20) break; }
  return out;
}

    b.style.top = pct[1]+'%';
    sp.appendChild(b);
    setTimeout(()=>{ try{ b.remove(); }catch(e){} }, 1700);
    sceneTimers.push(setTimeout(tick, 480));
  };
  sceneTimers.push(setTimeout(tick, 300));
}

}

function startCast(){
  if(castState!=='idle') return;
  const region = regionOf(profile.region);
  if(region.needsBait){
    if((profile.consumables.paradiseBait||0) <= 0){
      toast('낙원 전용 미끼가 있어야 낙원에서 낚시할 수 있어요');
      return;
    }
    profile.consumables.paradiseBait--;
    saveStore();
    const sceneRegionEl = $('#scene-region');
    if(sceneRegionEl) sceneRegionEl.textContent = `${region.name} · Lv.${region.unlockLv}+ · 미끼 ${profile.consumables.paradiseBait}개`;
  }
  castState='waiting'; applyCastVisualState();
  clearScene();
  playCastAnim(profile.region);
  const rod = currentRod(profile);
  let wait = 1000 + Math.random()*1200;
  if(rod.castTimeCut) wait *= (1-rod.castTimeCut);
  if(equippedTitleEffect().castTimeCut) wait *= (1-equippedTitleEffect().castTimeCut);
  setTimeout(()=>{
    if(castState!=='waiting' || !$('#tension-track')) return;
    castState='biting'; applyCastVisualState();
    beginTension();
  }, wait);
}

function beginTension(){
  const track = $('#tension-track');
  if(!track) return;
  track.innerHTML = '<div id="marker"></div>';
  const rod = currentRod(profile);
  const zoneMult = 1 + (rod.zoneBonus||0) + (equippedTitleEffect().zoneBonus||0);
  let perfectW = 9.5*zoneMult, goodW = 30*zoneMult;
  const center = 25 + Math.random()*50;
  const perfectStart = center - perfectW/2, goodStart = center - goodW/2;
  const zg = el('div','zone good'); zg.style.left=Math.max(0,goodStart)+'%'; zg.style.width=Math.min(100,goodW)+'%';
  const zp = el('div','zone perfect'); zp.style.left=Math.max(0,perfectStart)+'%'; zp.style.width=Math.min(100,perfectW)+'%';
  track.appendChild(zg); track.appendChild(zp); track.appendChild(document.getElementById('marker'));

  const regionIdx = REGIONS.findIndex(r=>r.id===profile.region);
  const speed = 1500 - regionIdx*160;
  const startT = performance.now();
  const marker = document.getElementById('marker');
  let dead = false;
  biteAnim = { perfectStart, perfectW, goodStart, goodW, pos:0 };

  function frame(t){
    if(dead) return;
    const el2 = t - startT;
    const cyc = el2 % (speed*2);
    const pos = cyc < speed ? (cyc/speed)*100 : 100-((cyc-speed)/speed)*100;
    biteAnim.pos = pos;
    if(marker) marker.style.left = 'calc(' + pos + '% - 2px)';
    updateRodBend(pos);
    if(el2 > speed*2*2.4){
      dead = true; castState='resolving'; applyCastVisualState();
      resolveCast(null);
      return;
    }
    biteAnim.raf = requestAnimationFrame(frame);
  }
  biteAnim.raf = requestAnimationFrame(frame);
  biteAnim.kill = ()=>{ dead=true; if(biteAnim.raf) cancelAnimationFrame(biteAnim.raf); };
}

function doHook(){
  if(castState!=='biting' || !biteAnim) return;
  const pos = biteAnim.pos;
  biteAnim.kill();
  castState='resolving'; applyCastVisualState();
  const inPerfect = pos >= biteAnim.perfectStart && pos <= biteAnim.perfectStart+biteAnim.perfectW;
  const inGood = pos >= biteAnim.goodStart && pos <= biteAnim.goodStart+biteAnim.goodW;
  resolveCast(inPerfect ? 'perfect' : (inGood ? 'good' : null));
}

function resolveCast(hit){
  const guaranteed = profile.consumables.guaranteedEpic > 0;
  if(!hit && !guaranteed){
    if(navigator.vibrate) try{navigator.vibrate(40);}catch(e){}
    profile.stats.misses++; saveStore();
    toast('아깝다! 놓쳤어요');
    castState='idle'; applyCastVisualState();
    return;
  }
  const paradiseRegion = regionOf(profile.region);
  const prevUnlocked = new Set(REGIONS.filter(r=>isRegionUnlocked(profile,r)).map(r=>r.id));
  const perfect = hit==='perfect';
  const rod = currentRod(profile);
  let grade;
  if(guaranteed){
    grade = guaranteedGrade(profile.region, rod, perfect);
    profile.consumables.guaranteedEpic--;
  } else {
    const w = computeWeights(profile.region, rod, perfect);
    grade = pickGrade(w);
  }
  let fish = pickFish(profile.region, grade);
  if(!fish){
    for(const g of [...GRADES].reverse()){ fish = pickFish(profile.region, g); if(fish) break; }
  }
  const prevLevel = expProgress(profile.totalExp).level;
  const traits = rollTraits();
  let mult = 1;
  if(profile.consumables.bait25 > 0){
    mult = byId(CONSUMABLES,'bait25').value;
    profile.consumables.bait25--;
  }
  const titleEff = equippedTitleEffect();
  if(profile.dexRewards.lake) mult *= 1.2;
  if(rod.pointsMult) mult *= rod.pointsMult;
  if(titleEff.pointsMult) mult *= titleEff.pointsMult;
  traits.forEach(t=> mult *= t.mult);
  const gainedPoints = Math.round(fish.points*mult);
  let expMult = (profile.dexRewards.sea ? 1.4 : 1) * (titleEff.expMult||1);
  traits.forEach(t=> expMult *= t.mult);
  const isFirst = !profile.dex[fish.id];
  profile.points += gainedPoints;
  profile.totalExp += Math.round(fish.points*expMult);
  profile.dex[fish.id] = (profile.dex[fish.id]||0)+1;
  profile.stats.catches++;
  let gotParadiseBait = false;
  if(!paradiseRegion.needsBait && profile.region!=='lake'){
    const dropChance = (PARADISE_BAIT_DROP_BY_REGION[profile.region]||0) + (equippedTitleEffect().baitDropBonus||0) + (profile.dexRewards.allButParadise ? 1 : 0);
    if(Math.random()*100 < dropChance){
      profile.consumables.paradiseBait = (profile.consumables.paradiseBait||0)+1;
      profile.paradiseBaitSeen = true;
      gotParadiseBait = true;
    }
  }
  saveStore();

  const newlyUnlocked = REGIONS.filter(r=> !prevUnlocked.has(r.id) && isRegionUnlocked(profile,r));
  const traitNameStr = traits.length ? traits.map(t=>t.name).join(' ') : null;

  if(navigator.vibrate) try{navigator.vibrate(perfect?[30,40,60]:[25]);}catch(e){}
  pushLocalFeed({ts:Date.now(), player:profile.name, fish:fish.name, grade, points:gainedPoints, perfect, trait: traitNameStr});
  pushProfileToDb();
  pushCatchToFamily(fish, grade, gainedPoints, perfect, traits);

  showCatchModal(fish, grade, gainedPoints, perfect, isFirst, traits, ()=>{
    checkDexRewards();
    const newLevel = expProgress(profile.totalExp).level;
    if(newLevel > prevLevel || newlyUnlocked.length){ showProgress(prevLevel, newLevel, newlyUnlocked); }
    else { castState='idle'; renderAll(); }
    if(gotParadiseBait) toast('낙원 전용 미끼를 얻었어요!');
    if(grade==='primordial') showCelebrate(fish, traits);
  });
}

function showProgress(prevLv, newLv, newlyUnlocked){

      if(!profile.consumables) profile.consumables = {bait25:0, guaranteedEpic:0, paradiseBait:0};
      profile.consumables.paradiseBait = (profile.consumables.paradiseBait||0) + milestoneCount;
      profile.paradiseBaitSeen = true;
      baitStr = ` · 낙원 전용 미끼 +${milestoneCount}개`;
    }
    saveStore();

    ${rewardHtml}

const REGION_DEX_PERK = {
  lake:'영구 포인트 1.2배', river:'영구 전설 이상 확률 +0.15%p', sea:'영구 EXP 1.4배', abyss:'', polar:'', paradise:''
};
function checkDexRewards(){
  REGIONS.forEach(r=>{
    if(profile.dexRewards[r.id]) return;
    const total = FISH.filter(f=>f.region===r.id).length;
    const have = FISH.filter(f=>f.region===r.id && profile.dex[f.id]).length;
    if(have>=total && total>0){
      profile.dexRewards[r.id]=true; profile.points += 1000;
      const perk = REGION_DEX_PERK[r.id];
      let extra = '';
      if(r.id==='paradise' && !profile.cosmetics.owned.includes('title_enlightened')){
        profile.cosmetics.owned.push('title_enlightened');
        extra = ' · "낚시의 이치를 깨달은 자" 칭호 획득';
      }
      saveStore();
      toast(r.name+' 도감 완성! +1000P'+(perk?' · '+perk+' 획득':'')+extra);
    }
  });
  if(!profile.dexRewards.allButParadise && REGIONS.filter(r=>r.id!=='paradise').every(r=>profile.dexRewards[r.id])){
    profile.dexRewards.allButParadise = true;
    saveStore();
    toast('낙원 제외 모든 도감 완성! 영구 낙원 전용 미끼 드롭 확률 +1%p 획득');
  }
  if(!profile.fullDexReward && FISH.every(f=>profile.dex[f.id])){
    profile.fullDexReward = true; profile.points += 5000;
    if(!profile.cosmetics.owned.includes('title_hof')) profile.cosmetics.owned.push('title_hof');
    saveStore();
    toast('전체 도감 완성! 명예의 전당 등록 +5000P');
  }
}

function buyConsumable(id){
  const item = byId(CONSUMABLES,id);
  if(profile.points < item.price){ toast('포인트가 부족해요'); return; }
  profile.points -= item.price;
  profile.consumables[item.id] = (profile.consumables[item.id]||0) + item.charges;
  saveStore(); pushProfileToDb(); renderAll();
  toast(item.name+' 구매 완료');
}
function handleRod(id){
  const r = byId(RODS,id);
  if(profile.ownedRods.includes(id)){
    profile.rod = id; saveStore(); renderAll(); toast(r.name+' 장착');
    return;
  }
  if(profile.points < r.price){ toast('포인트가 부족해요'); return; }
  profile.points -= r.price; profile.ownedRods.push(id); profile.rod = id;
  saveStore(); pushProfileToDb(); renderAll();
  toast(r.name+' 구매 및 장착');
}
function handleCosmetic(id){
  const item = byId(COSMETICS,id);
  if(profile.cosmetics.owned.includes(id)){
    profile.cosmetics.equipped[item.kind] = id; saveStore(); pushProfileToDb(); renderAll();
    return;
  }
  if(titleLocked(item)){ toast(titleLockMsg(item)); return; }
  if(profile.points < item.price){ toast('포인트가 부족해요'); return; }
  profile.points -= item.price; profile.cosmetics.owned.push(id); profile.cosmetics.equipped[item.kind]=id;
  saveStore(); pushProfileToDb(); renderAll();
  toast(item.name+' 구매 완료');
}

/* ---------- RENDER: DEX ---------- */
function oceanBubbles(){
  const arr=[[8,4,0],[22,6,1.2],[38,5,2.4],[55,7,0.6],[68,4,3.1],[82,6,1.8],[92,5,2.9],[15,7,4],[45,4,1.5]];
  return arr.map(([x,size,delay])=>`<span class="amb-bubble" style="left:${x}%; width:${size}px; height:${size}px; animation-delay:${delay}s;"></span>`).join('');
}
function renderDex(){
  const c = $('#content'); c.innerHTML='';
  const wrap = el('div');

  const tabs = el('div','dex-tabs');
  REGIONS.forEach(r=>{
    const t = el('div','dex-tab'+(r.id===dexRegionTab?' active':''), r.name);
    t.onclick = ()=>{ dexRegionTab=r.id; renderDex(); };
    tabs.appendChild(t);
  });
  wrap.appendChild(tabs);

  const ocean = el('div','dex-ocean');
  ocean.innerHTML = `<div class="rays"></div>${oceanBubbles()}`;

  const regionFish = FISH.filter(f=>f.region===dexRegionTab);
  const mineCount = regionFish.filter(f=> profile.dex[f.id]).length;
  const familyCount = regionFish.filter(f=> familyDexCount(f.id)>0).length;
  const dualRow = el('div','dex-dual');
  dualRow.innerHTML = `
    <div class="dex-dual-item">
      <div class="ddi-label">내 도감</div>
      <div class="progress-track"><div class="progress-fill" style="width:${mineCount/regionFish.length*100}%"></div></div>
      <div class="tabular">${mineCount}/${regionFish.length}</div>
    </div>
    <div class="dex-dual-item">
      <div class="ddi-label">우리 가족 도감</div>
      <div class="progress-track"><div class="progress-fill fam" style="width:${familyCount/regionFish.length*100}%"></div></div>
      <div class="tabular">${familyCount}/${regionFish.length}</div>
    </div>
  `;
  ocean.appendChild(dualRow);

  const scopeRow = el('div','dex-scope-toggle');
  scopeRow.innerHTML = `
    <div class="pill-toggle ${dexScope==='family'?'active':''}" data-scope="family">우리 가족 도감 보기</div>
    <div class="pill-toggle ${dexScope==='mine'?'active':''}" data-scope="mine">내 도감 보기</div>
  `;
  ocean.appendChild(scopeRow);

  const grid = el('div','fish-grid');
  regionFish.forEach(f=>{
    const count = dexScope==='family' ? familyDexCount(f.id) : (profile.dex[f.id]||0);
    const caught = count>0;
    const card = el('div','fish-card'+(caught?'':' uncaught'));
    card.innerHTML = `
      <div class="grade-strip" style="background:${caught?`var(${GRADE_VAR[f.grade]})`:'rgba(255,255,255,.3)'}"></div>
      ${caught?`<div class="fcnt tabular">${count}</div>`:''}
      ${caught? fishIcon(f) : `<span style="display:inline-block;opacity:.6">${renderFishSVG({...FISH_ART[f.id], fb:'#7d879c', bl:'#a6afc2', fin:'#5c6478', pattern:'none', patterns:null}, f.id+'-un')}</span>`}
      <div class="fname">${caught? f.name : '???'}</div>
      <div class="fpts tabular">${caught? fmt(f.points)+'P' : GRADE_LABEL[f.grade]}</div>
    `;
    if(caught){ card.onclick = ()=> showFishDetail(f); }
    grid.appendChild(card);
  });
  if(dexRegionTab==='paradise'){
    const seen = !!profile.paradiseBaitSeen;
    const baitCard = el('div','fish-card'+(seen?'':' uncaught'));
    baitCard.innerHTML = `
      <div class="grade-strip" style="background:${seen?'var(--g-primordial)':'rgba(255,255,255,.3)'}"></div>
      ${seen? baitIconSVG() : `<span style="display:inline-block;opacity:.6">${baitIconSVG()}</span>`}
      <div class="fname">${seen? '낙원 전용 미끼' : '???'}</div>
      <div class="fpts tabular">${seen? '아이템' : '태초'}</div>
    `;
    if(seen){
      baitCard.onclick = ()=> openSheet(`
        <div class="catch-fish-wrap">
          ${baitIconSVG()}
          <h2 class="catch-name">낙원 전용 미끼</h2>
          <div class="catch-pts tabular">현재 보유 ${profile.consumables.paradiseBait||0}개</div>
          <div class="fact-box">호수·강·바다·심해에서 물고기를 잡을 때 확률로 함께 발견돼요. 낙원에서 낚싯줄을 던질 때마다 1개씩 소모됩니다.</div>
        </div>
        <button class="sheet-close" onclick="document.getElementById('modal-layer').classList.remove('show')">닫기</button>
      `);
    }
    grid.appendChild(baitCard);
  }
  ocean.appendChild(grid);
  wrap.appendChild(ocean);

  const overallTotal = FISH.length;
  const overallMine = FISH.filter(f=> profile.dex[f.id]).length;
  const overallFamily = FISH.filter(f=> familyDexCount(f.id)>0).length;
  const summary = el('div','card');
  summary.innerHTML = `
    <div style="font-size:13px;">전체 도감 완성도</div>
    <div class="progress-row" style="margin-top:8px;"><div class="progress-track"><div class="progress-fill" style="width:${overallMine/overallTotal*100}%"></div></div><div class="tabular" style="font-size:12px;">내 ${overallMine}/${overallTotal}</div></div>
    <div class="progress-row"><div class="progress-track"><div class="progress-fill fam" style="width:${overallFamily/overallTotal*100}%"></div></div><div class="tabular" style="font-size:12px;">가족 ${overallFamily}/${overallTotal}</div></div>
  `;
  wrap.appendChild(summary);

  c.appendChild(wrap);
  wrap.querySelectorAll('[data-scope]').forEach(b=> b.onclick=()=>{ dexScope=b.dataset.scope; renderDex(); });
}
function showFishDetail(f){
  openSheet(`
    <div class="catch-fish-wrap">
      ${fishIcon(f)}
      <span class="grade-chip" style="background:var(${GRADE_VAR[f.grade]})">${GRADE_LABEL[f.grade]}</span>
      <h2 class="catch-name">${f.name}</h2>
      <div class="catch-pts tabular">${fmt(f.points)}P · 내가 잡은 횟수 ${profile.dex[f.id]||0}회</div>
      ${f.fact?`<div class="fact-box">${f.fact}</div>`:''}
    </div>
    <button class="sheet-close" onclick="document.getElementById('modal-layer').classList.remove('show')">닫기</button>
  `);
}

/* ---------- RENDER: RANKING ---------- */
let rankSort = 'points';
function renderRank(){
  const c = $('#content'); c.innerHTML='';
  const wrap = el('div');

  wrap.appendChild(el('div','section-title','우리 가족 랭킹'));
  if(!dbAvailable){
    const note = el('div','card'); note.style.marginBottom='12px';
    note.innerHTML = `<div style="font-size:12.5px;color:var(--ink-soft);line-height:1.5;">지금은 이 기기에만 연결되어 있어요. 다른 가족의 기기와 실시간으로 합치려면, 모두 같은 Claude 조직(팀/기업 플랜) 계정으로 접속해야 동기화돼요. 그 전까지는 이 기기에서 가족 프로필을 나눠 써도 함께 기록할 수 있어요.</div>`;
    wrap.appendChild(note);
  }

  const sortRow = el('div','dex-scope-toggle');
  sortRow.innerHTML = `<div class="pill-toggle ${rankSort==='points'?'active':''}" data-sort="points">포인트</div><div class="pill-toggle ${rankSort==='dex'?'active':''}" data-sort="dex">도감 완성률</div>`;
  wrap.appendChild(sortRow);

  const members = familyMembers();
  members.sort((a,b)=> rankSort==='points' ? b.points-a.points : b.dexCount-a.dexCount);
  const rankCard = el('div','card');
  members.forEach((m,i)=>{
    const title = COSMETICS.find(c=>c.id===m.title);
    const row = el('div','rank-row');
    const medal = i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1);
    row.innerHTML = `
      <div class="rank-num ${i<3?'top':''}">${medal}</div>
      <div class="rank-name">${title?`<span style="font-size:9.5px;font-weight:400;color:var(--gold);background:rgba(255,206,84,.15);padding:1px 6px;border-radius:8px;">${title.name}</span>`:''}${escapeHtml(m.name)}${m.id===profile.id?' <span style="font-size:10px;color:var(--ink-soft);">(나)</span>':''}<span class="rank-sub tabular">Lv.${m.level} · 도감 ${m.dexCount}/${FISH.length}</span></div>
      <div class="rank-val tabular">${rankSort==='points'? fmt(m.points)+'P' : m.dexCount+'종'}</div>
    `;
    rankCard.appendChild(row);
  });
  if(!members.length) rankCard.innerHTML = '<div style="font-size:12px;color:var(--ink-soft);">아직 기록이 없어요</div>';
  wrap.appendChild(rankCard);

  wrap.appendChild(el('div','section-title','최근 희귀 어종 소식'));
  const feedCard = el('div','card');
  const feed = combinedFeed().filter(e=> ['epic','legendary','secret','primordial'].includes(e.grade) || e.trait);
  if(!feed.length){ feedCard.innerHTML = '<div style="font-size:12px;color:var(--ink-soft);">아직 희귀 어종 기록이 없어요</div>'; }
  feed.slice(0,12).forEach(e=>{
    const d = new Date(e.ts);
    const time = (d.getMonth()+1)+'/'+d.getDate();
    const row = el('div','feed-row');
    const traitTxt = e.trait ? `<b>${escapeHtml(e.trait)}</b> ` : '';
    row.innerHTML = `<div class="feed-time">${time}</div><span class="grade-chip" style="background:var(${GRADE_VAR[e.grade]})">${GRADE_LABEL[e.grade]}</span><div style="flex:1;">${escapeHtml(e.player)}님이 ${traitTxt}<b>${escapeHtml(e.fish)}</b>${e.perfect?' (완벽!)':''}</div>`;
    feedCard.appendChild(row);
  });
  wrap.appendChild(feedCard);

  c.appendChild(wrap);
  wrap.querySelectorAll('[data-sort]').forEach(b=> b.onclick=()=>{ rankSort=b.dataset.sort; renderRank(); });
}

/* ---------- NAV / MAIN RENDER ---------- */
function renderNav(){
  document.querySelectorAll('.nav-btn').forEach(b=> b.classList.toggle('active', b.dataset.tab===activeTab));
}
function renderAll(){
  if(!profile){ ensureProfile(); return; }
  renderTopbar();
  if(activeTab==='fish') renderFish();
  else if(activeTab==='shop') renderShop();
  else if(activeTab==='dex') renderDex();
  else if(activeTab==='rank') renderRank();
  renderNav();
}
document.querySelectorAll('.nav-btn').forEach(b=> b.onclick=()=>{
  if((castState==='biting' || castState==='waiting') && b.dataset.tab!=='fish') return;
  activeTab = b.dataset.tab; renderAll();
});
$('#avatar-btn').onclick = ()=>{ if(profile) openProfileSwitcher(); };
$('#content').addEventListener('click', (e)=>{
  const id = e.target && e.target.id;
  if(id==='cast-btn') startCast();
  else if(id==='hook-btn') doHook();
  else if(id==='odds-btn') showOdds();
});

/* ---------- BOOT ---------- */
renderAll();
initDb();
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
})();
</script>
